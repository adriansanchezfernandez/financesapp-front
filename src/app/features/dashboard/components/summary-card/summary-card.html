<mat-card class="summary-card">
  <mat-card-content>
    <div class="flex align-items-center justify-content-between">
      <span class="card-title">{{ title() }}</span>

      <mat-icon>{{ icon() }}</mat-icon>
    </div>

    <div class="card-value">
      {{ value() }}
    </div>
  </mat-card-content>
</mat-card>
