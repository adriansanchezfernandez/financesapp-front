<h2 mat-dialog-title>Eliminar movimiento</h2>

<mat-dialog-content>
  ¿Estás seguro de que quieres eliminar este movimiento?
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="false">
    Cancelar
  </button>

  <button mat-flat-button [mat-dialog-close]="true">
    Eliminar
  </button>
</mat-dialog-actions>
