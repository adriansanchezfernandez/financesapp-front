name: Angular CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  angular:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests
        run: npx ng test --watch=false

      - name: Compilar Angular
        run: npm run build